name: Linux tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install -e '.[ui,test]'
      - name: Test
        run: python -m pytest -q
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
